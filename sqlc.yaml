version: "2"
sql:
  - engine: postgresql
    schema: migrations/sql
    queries: internal/access/queries.sql
    gen:
      go:
        package: accessdb
        out: internal/access/accessdb
        sql_package: pgx/v5
        emit_empty_slices: true
        omit_unused_structs: true
  - engine: postgresql
    schema: migrations/sql
    queries: internal/execution/queries.sql
    gen:
      go:
        package: executiondb
        out: internal/execution/executiondb
        sql_package: pgx/v5
        emit_empty_slices: true
        omit_unused_structs: true
  # Environment smoke fixture only. Add module-owned query sets when used.
  - engine: postgresql
    schema: tests/environment/testdata/migrations
    queries: tests/environment/testdata/queries.sql
    gen:
      go:
        package: fixturedb
        out: tests/environment/fixturedb
        sql_package: pgx/v5
        emit_empty_slices: true
