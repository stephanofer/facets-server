info:
  name: get-catalog-entry
  type: http
  seq: 13
http:
  method: GET
  url: "{{baseUrl}}/v1/spaces/{{spaceId}}/catalog/{{catalogEntryId}}"
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) bru.setVar("catalogVersion", res.body.version);
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.id
      operator: isString
