info:
  name: edit-due-item
  type: http
  seq: 49
http:
  method: PUT
  url: "{{baseUrl}}/v1/spaces/{{spaceId}}/dues/{{dueId}}"
  auth: inherit
  headers:
    - name: Idempotency-Key
      value: "{{dueEditKey}}"
  body:
    type: json
    data: |-
      {"version":{{dueVersion}},"name":"Synthetic rent","date":"2026-11-01","amount":{"certainty":"confirmed","amount_minor":"2000","maximum_minor":null},"state":"open","reason":"Confirm invoice amount","confirm":true}
runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar("dueEditKey")) bru.setVar("dueEditKey", bru.interpolate("{{$randomUUID}}"));
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.id
      operator: isString
docs: Explicitly confirms amount or renegotiates the date, retaining revisions. Use skipped or cancelled only after unlinking existing applications. This never pays a due or cancels an external contract. Preserve key, version and body for retry; refresh detail before a distinct edit and reset dueEditKey.
