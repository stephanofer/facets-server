info:
  name: preview-account-reconciliation
  type: http
  seq: 39
http:
  method: POST
  url: "{{baseUrl}}/v1/spaces/{{spaceId}}/accounts/{{accountId}}/reconciliation-preview"
  auth: inherit
  body:
    type: json
    data: |-
      {"date":"2026-11-02","observed_minor":"115000"}
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.observed_minor
      operator: isString
docs: Read-only comparison against the calculated end-of-date balance, without receipt, reconciliation or adjustment writes. Unknown reference and difference remain null. Supply calculated_minor as expected_calculated_minor when confirming; a changed calculation conflicts rather than applying an unexpected adjustment. Preview is not a reservation.
