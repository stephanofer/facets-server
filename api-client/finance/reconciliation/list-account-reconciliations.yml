http:
  method: GET
  url: "{{baseUrl}}/v1/spaces/{{spaceId}}/accounts/{{accountId}}/reconciliations?limit=50"
  params:
    - name: cursor
      value: ""
      type: query
      disabled: true
    - name: limit
      value: "50"
      type: query
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.items
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

