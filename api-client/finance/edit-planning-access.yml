info:
  name: edit-planning-access
  type: http
  seq: 64
http:
  method: PUT
  url: "{{baseUrl}}/v1/spaces/{{spaceId}}/planning-resources/{{planningResourceId}}/access"
  auth: inherit
  headers:
    - name: Idempotency-Key
      value: "{{planningAccessKey}}"
  body:
    type: json
    data: |-
      {"version":{{planningAccessVersion}},"confirm":true,"responsible_member_id":"{{planningResponsibleMemberId}}","visibility":"space","readers":[],"reason":"Explicit synthetic shared consultation"}
runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar("planningAccessKey")) bru.setVar("planningAccessKey", bru.interpolate("{{$randomUUID}}"));
    - type: after-response
      code: |-
        if (res.status === 200) bru.setVar("planningAccessVersion", "");
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
docs: Review get-planning-access and the audience before confirming. Requires recent authentication. This example explicitly shares consultation with the space, not administration. Keep key/body/version unchanged for retries; use selected with reader membership IDs for restricted sharing. A transfer requires an already authorized non-reader recipient.
