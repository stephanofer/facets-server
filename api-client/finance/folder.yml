info:
  name: finance
  type: folder
  seq: 8
request:
  auth: inherit
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar("spaceId")) {
          const response = await bru.runRequest("spaces/list-spaces");
          if (response.status !== 200 || !bru.getVar("spaceId")) throw new Error("Select an accessible space first.");
        }
        if (bru.getVar("financeSpaceId") !== bru.getVar("spaceId")) {
          for (const key of ["accountId", "accountVersion", "catalogEntryId", "catalogVersion", "mergeTargetId", "mergeTargetVersion", "exchangeReferenceId", "recoveryAccountId", "recoveryAccountVersion", "operationId", "operationActionKey", "operationVersion", "operationCorrectionKey", "operationVoidKey", "operationRevision", "operationRevisionCursor", "reconciliationId", "reconciliationActionKey", "consistencyCheckId", "consistencyActionKey"]) bru.setVar(key, "");
          bru.setVar("financeSpaceId", bru.getVar("spaceId"));
          for (const key of ["dueId", "dueVersion", "dueCreateKey", "dueEditKey", "paymentApplyKey", "paymentApplicationId", "paymentUnlinkKey", "paymentOperationKey", "effectOrdinal"]) bru.setVar(key, "");
          for (const key of ["seriesId", "seriesVersion", "seriesGeneratedUntil", "seriesCreateKey", "seriesEditKey", "seriesGenerateKey"]) bru.setVar(key, "");
          for (const key of ["planningResourceId", "planningAccessVersion", "planningResponsibleMemberId", "planningAccessKey", "planningRecoveryKey", "recoveryPlanningId", "recoveryPlanningVersion", "reminderVersion", "reminderConfigureKey", "reminderSnoozeKey", "reminderSnoozeUntil", "seriesReminderVersion", "seriesReminderKey"]) bru.setVar(key, "");
        }
        const name = req.getName();
        if (["get-due-reminder", "configure-due-reminder", "snooze-due-reminder"].includes(name) && !bru.getVar("dueId")) throw new Error("Select an authorized dueId first.");
        if (name === "configure-due-reminder" && (bru.getVar("reminderVersion") === undefined || bru.getVar("reminderVersion") === "" || !bru.getVar("dueVersion"))) throw new Error("Review get-due-item and get-due-reminder first.");
        if (name === "snooze-due-reminder" && (!bru.getVar("reminderVersion") || !bru.getVar("reminderSnoozeUntil"))) throw new Error("Review the reminder and choose reminderSnoozeUntil explicitly.");
        if (["get-series-reminder", "configure-series-reminder"].includes(name) && !bru.getVar("seriesId")) throw new Error("Select an authorized seriesId first.");
        if (name === "configure-series-reminder" && (bru.getVar("seriesReminderVersion") === undefined || bru.getVar("seriesReminderVersion") === "")) throw new Error("Review get-series-reminder first.");
        if (["get-planning-access", "edit-planning-access"].includes(name) && !bru.getVar("planningResourceId")) throw new Error("Select planningResourceId from an accountless due or series first.");
        if (name === "edit-planning-access" && (!bru.getVar("planningAccessVersion") || !bru.getVar("planningResponsibleMemberId"))) throw new Error("Review get-planning-access before confirming.");
        if (name === "recover-planning-resource" && (!bru.getVar("recoveryPlanningId") || !bru.getVar("recoveryPlanningVersion"))) throw new Error("Explicitly select a reference from list-recoverable-planning-resources first.");
        if (["get-recurring-series", "edit-recurring-series", "generate-recurring-occurrences", "list-recurring-series-versions"].includes(name) && !bru.getVar("seriesId")) throw new Error("Create a series or explicitly select seriesId from the authorized list.");
        if (["edit-recurring-series", "generate-recurring-occurrences"].includes(name) && !bru.getVar("seriesVersion")) throw new Error("Review get-recurring-series first. Preserve the original version/body for retries.");
        if (name === "edit-recurring-series" && !bru.getVar("seriesGeneratedUntil")) throw new Error("Review the existing generation boundary first.");
        if (name === "create-payment-operation" && (!bru.getVar("accountId") || !bru.getVar("dueId") || !bru.getVar("dueVersion"))) throw new Error("Select the actual account and review the target due/version before recording a payment. Preserve the original body/version for retries.");
        if (name === "get-movement-application-capacity" && !bru.getVar("operationId")) throw new Error("Select an authorized operation first.");
        if (["get-due-item", "edit-due-item", "apply-payment", "list-due-applications", "unlink-payment"].includes(name) && !bru.getVar("dueId")) throw new Error("Create a due, or select dueId from the authorized list.");
        if (["edit-due-item", "apply-payment", "unlink-payment"].includes(name) && !bru.getVar("dueVersion")) throw new Error("Review get-due-item first. Preserve the original body/version for retries.");
        if (name === "apply-payment" && (!bru.getVar("operationId") || !bru.getVar("operationVersion"))) throw new Error("Review the actual get-financial-operation before applying it.");
        if (name === "unlink-payment" && !bru.getVar("paymentApplicationId")) throw new Error("Select an application from list-due-applications first.");
        if (["get-financial-account", "edit-financial-account", "get-account-sharing", "share-financial-account", "transfer-account-responsibility", "create-financial-operation", "list-account-operation-history", "preview-account-reconciliation", "reconcile-account", "list-account-reconciliations", "check-account-consistency", "list-account-consistency-checks"].includes(name) && !bru.getVar("accountId")) throw new Error("Run create-financial-account, or select accountId from list-financial-accounts.");
        if (["get-financial-operation", "preview-operation-correction", "correct-financial-operation", "void-financial-operation", "list-operation-revisions", "get-operation-revision"].includes(name) && !bru.getVar("operationId")) throw new Error("Run create-financial-operation, or select operationId from the authorized account history.");
        if (["preview-operation-correction", "correct-financial-operation", "void-financial-operation"].includes(name) && !bru.getVar("operationVersion")) throw new Error("Read get-financial-operation and review the current version first.");
        if (name === "get-operation-revision" && !bru.getVar("operationRevision")) throw new Error("Explicitly select operationRevision from list-operation-revisions.");
        if (["edit-financial-account", "share-financial-account", "transfer-account-responsibility"].includes(name) && !bru.getVar("accountVersion")) {
          const response = await bru.runRequest("finance/get-financial-account");
          if (response.status !== 200) throw new Error("Cannot read current account version.");
        }
        if (["get-catalog-entry", "edit-catalog-entry", "merge-catalog-entries"].includes(name) && !bru.getVar("catalogEntryId")) throw new Error("Run create-catalog-entry, or select catalogEntryId from list-catalog-entries.");
        if (["edit-catalog-entry", "merge-catalog-entries"].includes(name) && !bru.getVar("catalogVersion")) {
          const response = await bru.runRequest("finance/get-catalog-entry");
          if (response.status !== 200) throw new Error("Cannot read current catalog version.");
        }
        if (name === "merge-catalog-entries" && (!bru.getVar("mergeTargetId") || !bru.getVar("mergeTargetVersion"))) throw new Error("Explicitly select mergeTargetId and its current mergeTargetVersion. No target is guessed.");
        if (name === "transfer-account-responsibility" && !bru.getVar("memberId")) throw new Error("Select a current authorized memberId first.");
        if (name === "recover-financial-account" && (!bru.getVar("recoveryAccountId") || !bru.getVar("recoveryAccountVersion"))) throw new Error("Run list-recoverable-accounts and explicitly select recoveryAccountId and recoveryAccountVersion.");
        if (["get-exchange-reference", "convert-informative-amount"].includes(name) && !bru.getVar("exchangeReferenceId")) throw new Error("Run create-exchange-reference, or select an exchangeReferenceId.");
