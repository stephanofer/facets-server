info:
  name: list-exchange-references
  type: http
  seq: 17
  tags: [smoke]
http:
  method: GET
  url: "{{baseUrl}}/v1/spaces/{{spaceId}}/exchange-references?from_currency=USD&to_currency=PEN&context=historical"
  auth: inherit
  params:
    - name: from_currency
      value: USD
      type: query
    - name: to_currency
      value: PEN
      type: query
    - name: context
      value: historical
      type: query
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.items
      operator: isArray
docs: Historical and current contexts are distinct. Listing never invents a missing rate or implicitly selects one for financial writes.
