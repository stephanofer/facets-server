info:
  name: create-catalog-entry
  type: http
  seq: 11
http:
  method: POST
  url: "{{baseUrl}}/v1/spaces/{{spaceId}}/catalog"
  auth: inherit
  headers:
    - name: Idempotency-Key
      value: "{{$randomUUID}}"
  body:
    type: json
    data: '{"kind":"tag","value":{"name":"Synthetic trip"}}'
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) { bru.setVar("catalogEntryId", res.body.id); bru.setVar("catalogVersion", ""); }
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
docs: Owner/admin only. Kinds are category, merchant, counterparty and tag. Categories also require direction income/expense, icon and color; optional parent_id must identify an active root of the same direction.
