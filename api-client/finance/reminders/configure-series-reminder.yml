info:
  name: configure-series-reminder
  type: http
  seq: 5

http:
  method: PUT
  url: "{{baseUrl}}/v1/spaces/{{spaceId}}/series/{{seriesId}}/reminder"
  headers:
    - name: Idempotency-Key
      value: "{{seriesReminderKey}}"
  body:
    type: json
    data: |-
      {
        "version": {{seriesReminderVersion}},
        "enabled": true,
        "days_before": 1,
        "hour": 9,
        "minute": 0,
        "zone": "America/Lima",
        "confirm": true,
        "reason": "Personal future occurrence reminders"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: if (!bru.getVar("seriesReminderKey")) bru.setVar("seriesReminderKey", bru.interpolate("{{$randomUUID}}"));
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Review get-series-reminder first. Only future generated occurrences whose reminder times have not passed use this personal default; it never rewrites already materialized reminders. Configure those individually, or disable notifications globally to suppress all delivery. No financial operation or provider payment is created.
