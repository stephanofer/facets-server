info:
  name: recover-financial-account
  type: http
  seq: 9
http:
  method: POST
  url: "{{baseUrl}}/v1/spaces/{{spaceId}}/accounts/{{recoveryAccountId}}/recovery"
  auth: inherit
  headers:
    - name: Idempotency-Key
      value: "{{$randomUUID}}"
  body:
    type: json
    data: |-
      {"version":{{recoveryAccountVersion}},"confirm":true}
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
docs: Explicitly rebinds the same identity's ended responsibility to its new membership. Requires recent authentication and a non-reader role. Does not restore other ended grants, publish accounts or change positions.
