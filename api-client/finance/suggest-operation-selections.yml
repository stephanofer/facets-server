info:
  name: suggest-operation-selections
  type: http
  seq: 45
http:
  method: GET
  url: "{{baseUrl}}/v1/spaces/{{spaceId}}/operation-suggestions?kind=expense&limit=10"
  auth: inherit
  params:
    - name: kind
      value: expense
      type: query
    - name: merchant_id
      value: ""
      type: query
      disabled: true
    - name: limit
      value: "10"
      type: query
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isArray
docs: Returns up to 20 recent current manual selections by the authenticated actor, optionally for a merchant, using canonical non-archived classification. Split operations do not propose their first part as classification for the entire purchase. Suggestions are evidence, never automatic writes or recurrence detection.
