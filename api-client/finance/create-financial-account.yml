info:
  name: create-financial-account
  type: http
  seq: 1
http:
  method: POST
  url: "{{baseUrl}}/v1/spaces/{{spaceId}}/accounts"
  auth: inherit
  headers:
    - name: Idempotency-Key
      value: "{{$randomUUID}}"
  body:
    type: json
    data: |-
      {"name":"Synthetic bank account","kind":"bank","currency":"PEN","opening":{"date":"2026-11-01","amount_minor":"12000","quality":"confirmed"},"sharing":{"visibility":"private","space_permission":"read","grants":[]}}
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) { bru.setVar("accountId", res.body.id); bru.setVar("accountVersion", ""); }
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.id
      operator: isString
docs: Creates a new position, not an income. For unknown amounts use null and quality unknown. Each execution is a new action, not a retry.
