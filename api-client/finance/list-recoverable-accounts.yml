info:
  name: list-recoverable-accounts
  type: http
  seq: 8
http:
  method: GET
  url: "{{baseUrl}}/v1/spaces/{{spaceId}}/accounts/recoverable"
  auth: inherit
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.items
      operator: isArray
docs: Requires recent authentication. Lists only opaque IDs and versions of the caller's former responsibilities. Does not return financial content or restore access. Explicitly choose recoveryAccountId and recoveryAccountVersion before recovery.
