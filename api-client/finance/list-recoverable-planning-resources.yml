info:
  name: list-recoverable-planning-resources
  type: http
  seq: 65
http:
  method: GET
  url: "{{baseUrl}}/v1/spaces/{{spaceId}}/planning-resources/recoverable?limit=50"
  auth: inherit
  params:
    - name: limit
      value: "50"
      type: query
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.items
      operator: isArray
docs: Requires recent authentication. After rejoining, returns only references for this same identity's ended accountless responsibilities. Explicitly select recoveryPlanningId and recoveryPlanningVersion; listing grants no access and restores nothing.
