info:
  name: list-recurring-series
  type: http
  seq: 60
http:
  method: GET
  url: "{{baseUrl}}/v1/spaces/{{spaceId}}/series?limit=50"
  auth: inherit
  params:
    - name: limit
      value: "50"
      type: query
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.items
      operator: isArray
docs: SQL-authorized series list; owners/admins cannot read private accounts. Select seriesId explicitly from the authorized result. Pass next_cursor as cursor for subsequent pages; a cursor never grants access.
