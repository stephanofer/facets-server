info:
  name: query-financial-summary
  type: http
  seq: 46
http:
  method: GET
  url: "{{baseUrl}}/v1/spaces/{{spaceId}}/financial-summary?from=2026-11-01&to=2026-12-01"
  auth: inherit
  params:
    - name: from
      value: "2026-11-01"
      type: query
    - name: to
      value: "2026-12-01"
      type: query
    - name: account_id
      value: "{{accountId}}"
      type: query
      disabled: true
    - name: currency
      value: PEN
      type: query
      disabled: true
    - name: category_id
      value: ""
      type: query
      disabled: true
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.totals
      operator: isArray
    - expression: res.body.scope
      operator: eq
      value: authorized_accounts_only
docs: Common backend query for current positions (liquid, obligation and receivable), period income/net expense, and period liquid-account effects by kind. The interval is from-inclusive/to-exclusive; category_id filters only economic components, not positions or cash. Original currencies remain separate with no fabricated consolidated total. Unknown opening balances contribute no confirmed zero; known subtotal has complete/confirmed flags. Cash includes authorized ends of private-counterpart transfers without exposing opposite accounts or shared metadata, and identifies adjustments separately from real cash flows. Only current in-tracking non-void facts enter period readings. Full reporting/conversions belong to block 11.
