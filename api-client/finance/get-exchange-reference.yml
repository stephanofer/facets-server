info:
  name: get-exchange-reference
  type: http
  seq: 18
http:
  method: GET
  url: "{{baseUrl}}/v1/spaces/{{spaceId}}/exchange-references/{{exchangeReferenceId}}"
  auth: inherit
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.reference.rate
      operator: isString
    - expression: res.body.rounding
      operator: eq
      value: half_even
