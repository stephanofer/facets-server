info:
  name: edit-planning-access
  type: http
  seq: 2

http:
  method: PUT
  url: "{{baseUrl}}/v1/spaces/{{spaceId}}/planning-resources/{{planningResourceId}}/access"
  headers:
    - name: Idempotency-Key
      value: "{{planningAccessKey}}"
  body:
    type: json
    data: |-
      {
        "version": {{planningAccessVersion}},
        "confirm": true,
        "responsible_member_id": "{{planningResponsibleMemberId}}",
        "visibility": "space",
        "readers": [],
        "reason": "Explicit synthetic shared consultation"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: if (!bru.getVar("planningAccessKey")) bru.setVar("planningAccessKey", bru.interpolate("{{$randomUUID}}"));
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Review get-planning-access and the audience before confirming. Requires recent authentication. This example explicitly shares consultation with the space, not administration. Keep key/body/version unchanged for retries; use selected with reader membership IDs for restricted sharing. A transfer requires an already authorized non-reader recipient.
