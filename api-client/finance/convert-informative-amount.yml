info:
  name: convert-informative-amount
  type: http
  seq: 19
http:
  method: POST
  url: "{{baseUrl}}/v1/spaces/{{spaceId}}/exchange-conversions"
  auth: inherit
  body:
    type: json
    data: '{"amount_minor":"100","currency":"USD","target_currency":"PEN","reference_id":"{{exchangeReferenceId}}","date":"2026-11-01","context":"historical"}'
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.amount_minor
      operator: eq
      value: "375"
    - expression: res.body.complete
      operator: eq
      value: "true"
    - expression: res.body.informative_only
      operator: eq
      value: "true"
docs: Uses the synthetic reference created above. With no reference_id for different currencies, returns complete false, amount_minor null and missing_exchange_reference. Historical conversions require the same effective date; current valuations accept an explicitly chosen reference on or before the requested date. This query never changes balances.
