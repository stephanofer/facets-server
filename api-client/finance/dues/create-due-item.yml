info:
  name: create-due-item
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/v1/spaces/{{spaceId}}/dues"
  headers:
    - name: Idempotency-Key
      value: "{{dueCreateKey}}"
  body:
    type: json
    data: |-
      {
        "account_id": "{{accountId}}",
        "direction": "payment",
        "name": "Synthetic rent",
        "date": "2026-11-01",
        "amount": {
          "certainty": "confirmed",
          "amount_minor": "2000",
          "maximum_minor": null
        },
        "confirm": true
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: if (!bru.getVar("dueCreateKey")) bru.setVar("dueCreateKey", bru.interpolate("{{$randomUUID}}"));
    - type: after-response
      code: if (res.status === 200) bru.setVar("dueId", res.body.id);
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.id
      operator: isString

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Creates an expectation only, without movement or balance change. With account_id, privacy/currency follow that account. For an accountless private commitment or expected income, remove account_id and supply currency (for example PEN); direction is payment or receipt. Detail returns resource_id for explicit sharing. Keep key/body for retries; clear dueCreateKey only for a distinct expectation. Unknown requires both amounts null; a range requires both bounds. Minor units use the declared currency's scale.
