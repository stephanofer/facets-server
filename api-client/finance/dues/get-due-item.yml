info:
  name: get-due-item
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/v1/spaces/{{spaceId}}/dues/{{dueId}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          bru.setVar("dueVersion", res.body.version);
          bru.setVar("planningResourceId", res.body.resource_id || "");
        }
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.applied_minor
      operator: isString

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Refresh version before an edit, application or unlink. Pending and excess are null unless amount is confirmed. A partial due may also be overdue. The upcoming window is seven civil days in the space time zone. Access requires the planned account and every active application relation; sharing a plan never shares a private payment.
