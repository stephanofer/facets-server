info:
  name: list-due-items
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/v1/spaces/{{spaceId}}/dues?limit=50"
  params:
    - name: limit
      value: "50"
      type: query
    - name: from
      value: 2026-11-01
      type: query
      disabled: true
    - name: until
      value: 2026-12-01
      type: query
      disabled: true
    - name: cursor
      value: ""
      type: query
      disabled: true
    - name: status
      value: partial
      type: query
      disabled: true
    - name: account_id
      value: "{{accountId}}"
      type: query
      disabled: true
    - name: series_id
      value: "{{seriesId}}"
      type: query
      disabled: true
    - name: direction
      value: payment
      type: query
      disabled: true
    - name: currency
      value: PEN
      type: query
      disabled: true
    - name: origin
      value: recurring
      type: query
      disabled: true
    - name: unassigned
      value: "true"
      type: query
      disabled: true
    - name: reminder
      value: delivered
      type: query
      disabled: true
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.items
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Authorized standalone and generated expectations in date/identity order. From is inclusive and until exclusive. Enable filters in both URL and params. Unassigned selects accountless commitments; reminder selects your own scheduled, delivered (durable in-app inbox), or stale reminders. All filters and sensitive-relation permissions apply before pagination. Recurring items expose historical suggested metadata, not an automatic classification. Partial may also be overdue. A cursor is not authorization and listing never generates obligations or payments.
