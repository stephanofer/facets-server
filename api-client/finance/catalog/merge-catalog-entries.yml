info:
  name: merge-catalog-entries
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/v1/spaces/{{spaceId}}/catalog/{{catalogEntryId}}/merge"
  headers:
    - name: Idempotency-Key
      value: "{{$randomUUID}}"
  body:
    type: json
    data: |-
      {
        "target_id": "{{mergeTargetId}}",
        "version": {{catalogVersion}},
        "target_version": {{mergeTargetVersion}},
        "confirm": true
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: if (res.status === 200) bru.setVar("catalogVersion", "");
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Select both identities deliberately. Kinds and category direction must match. Source is archived with a redirect; its identity and merge history remain. Children are reparented to the target, changing future grouping without changing financial amounts. Invalid depth or duplicate active names fail atomically.
