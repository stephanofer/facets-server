info:
  name: create-payment-operation
  type: http
  seq: 54
http:
  method: POST
  url: "{{baseUrl}}/v1/spaces/{{spaceId}}/payment-operations"
  auth: inherit
  headers:
    - name: Idempotency-Key
      value: "{{paymentOperationKey}}"
  body:
    type: json
    data: |-
      {"operation":{"kind":"expense","date":"2026-11-01","applied":{"account_id":"{{accountId}}","amount_minor":"1200"},"parts":[],"fees":[],"tag_ids":[],"exceptional":false,"confirm":true},"allocations":[{"due_id":"{{dueId}}","version":{{dueVersion}},"movement_minor":"1200","due_minor":"1200"}],"confirm_access_restriction":false}
runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar("paymentOperationKey")) bru.setVar("paymentOperationKey", bru.interpolate("{{$randomUUID}}"));
    - type: after-response
      code: |-
        if (res.status === 200) {
          bru.setVar("operationId", res.body.id);
          bru.setVar("operationVersion", 1);
        }
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.id
      operator: isString
docs: Confirm actual date/account/amount and current target versions before sending. Creates one real expense/income/refund and applies its primary effect to all supplied dues in one transaction. Any invalid allocation rolls back the movement and balance too. Do not run create-operation first. Use operation kind income for an expected receipt; do not simulate debt payments or transfers as expenses. Different actual and expected accounts require explicit privacy-restriction confirmation. Reset paymentOperationKey only for a distinct action; refresh the due after success. Cancellation of a provider contract is not performed.
