info:
  name: list-operation-revisions
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/v1/spaces/{{spaceId}}/operations/{{operationId}}/revisions?cursor={{operationRevisionCursor}}&limit=50"
  params:
    - name: cursor
      value: "{{operationRevisionCursor}}"
      type: query
    - name: limit
      value: "50"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: if (!bru.getVar("operationRevisionCursor")) bru.setVar("operationRevisionCursor", "");
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.items
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Lists retained evidence with current account permissions applied in SQL before pagination. Revisions involving a now-private former account are not disclosed. Select operationRevision explicitly from authorized items to inspect it; use next_cursor for another page. Does not alter operationVersion used by a pending command.
