info:
  name: list-account-operation-history
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/v1/spaces/{{spaceId}}/accounts/{{accountId}}/history?limit=50"
  params:
    - name: cursor
      value: ""
      type: query
      disabled: true
    - name: limit
      value: "50"
      type: query
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.items
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Stable operation-ID/effect-ordinal cursor. A transfer and its fee are distinct effects of the same operation, not separate facts. in_tracking=false identifies antecedents already included in the opening balance. Each entry contains only this account's effect, never restricted counter-end metadata.
