info:
  name: get-financial-account
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/v1/spaces/{{spaceId}}/accounts/{{accountId}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: if (res.status === 200) bru.setVar("accountVersion", res.body.version);
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.id
      operator: isString
    - expression: res.body.opening.quality
      operator: isString

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: balance_minor may be null. Never treat unknown as confirmed zero. can_operate and can_administer are distinct.
