info:
  name: propose-account-visibility
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/v1/spaces/{{spaceId}}/accounts/proposal"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.requires_explicit_confirmation
      operator: eq
      value: "true"
    - expression: res.body.existing_accounts_unchanged
      operator: eq
      value: "true"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: The server proposes private/space according to the current preference and membership. Show this choice before account creation; the create request must still send its explicit sharing configuration. Does not create, edit or share anything.
