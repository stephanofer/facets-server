info:
  name: get-account-sharing
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/v1/spaces/{{spaceId}}/accounts/{{accountId}}/sharing"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.grants
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Only the responsible member can read account access configuration. Ended membership grants are not returned as active grants.
