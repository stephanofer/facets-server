info:
  name: preview-recurring-series
  type: http
  seq: 55
http:
  method: POST
  url: "{{baseUrl}}/v1/spaces/{{spaceId}}/series/preview"
  auth: inherit
  body:
    type: json
    data: |-
      {"recurrence":{"start":"2026-11-01","frequency":"twice_monthly","interval":0,"first_day":30,"second_day":31,"count":0},"from":"2026-11-01","until":"2026-12-01"}
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.length
      operator: eq
      value: "2"
    - expression: res.body[0].date
      operator: eq
      value: "2026-11-30"
    - expression: res.body[1].date
      operator: eq
      value: "2026-11-30"
docs: Read-only calendar preview. Both nominal slots survive clipping to the same day. This example deliberately previews a different frequency from the monthly creation example; review the intended rule before creating or editing. Maximum window is 366 civil days, until exclusive.
