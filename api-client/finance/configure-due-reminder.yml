info:
  name: configure-due-reminder
  type: http
  seq: 68
http:
  method: PUT
  url: "{{baseUrl}}/v1/spaces/{{spaceId}}/dues/{{dueId}}/reminder"
  auth: inherit
  headers:
    - name: Idempotency-Key
      value: "{{reminderConfigureKey}}"
  body:
    type: json
    data: |-
      {"version":{{reminderVersion}},"due_version":{{dueVersion}},"enabled":true,"days_before":1,"hour":9,"minute":0,"zone":"America/Lima","confirm":true,"reason":"Explicit personal synthetic reminder"}
runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar("reminderConfigureKey")) bru.setVar("reminderConfigureKey", bru.interpolate("{{$randomUUID}}"));
    - type: after-response
      code: |-
        if (res.status === 200) bru.setVar("reminderVersion", "");
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
docs: Review get-due-item and get-due-reminder first. Configures only the current member's reminder, including readers; cannot address third parties. A past schedule explicitly requests immediate delivery. Requires the notifications worker. Keep the body/key unchanged for a retry.
