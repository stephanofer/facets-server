info:
  name: get-exchange-reference
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/v1/spaces/{{spaceId}}/exchange-references/{{exchangeReferenceId}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.reference.rate
      operator: isString
    - expression: res.body.rounding
      operator: eq
      value: half_even

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
