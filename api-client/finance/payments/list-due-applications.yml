info:
  name: list-due-applications
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/v1/spaces/{{spaceId}}/dues/{{dueId}}/applications"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          const selected = res.body.find(item => item.id === bru.getVar("paymentApplicationId"));
          bru.setVar("paymentApplicationId", selected ? selected.id : (res.body[0]?.id || ""));
        }
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: At most 100 active applications per due and per operation. Source revision identifies the original evidence; compatible corrections retain the relation. Released applications remain in audit history, not this active list. Voiding the source releases applications atomically and reopens fulfillment.
