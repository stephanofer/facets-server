info:
  name: staff-profile
  type: http
  seq: 2
http:
  method: GET
  url: "{{baseUrl}}/v1/internal/me"
  auth: inherit
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.id
      operator: isString
    - expression: res.body.mfa_enabled
      operator: eq
      value: "true"
