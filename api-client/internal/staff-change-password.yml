info:
  name: staff-change-password
  type: http
  seq: 8
http:
  method: POST
  url: "{{baseUrl}}/v1/internal/me/password"
  auth: inherit
  body:
    type: json
    data: |-
      { "password": "{{staffNewPassword}}" }
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          bru.setVar("staffPassword", bru.interpolate("{{staffNewPassword}}"));
          bru.setVar("staffToken", "");
          bru.setVar("staffSessionId", "");
        }
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.status
      operator: eq
      value: acknowledged
docs: |-
  Requires recent authentication and revokes all staff sessions. Next login uses
  the new password in memory; update STAFF_PASSWORD in .env before restarting Bruno.
