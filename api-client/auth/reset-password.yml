info:
  name: reset-password
  type: http
  seq: 8
http:
  method: POST
  url: "{{baseUrl}}/v1/auth/password-reset"
  # No auth: do not inherit the collection Bearer token.
  body:
    type: json
    data: |-
      {
        "token": "{{recoveryToken}}",
        "password": "{{customerNewPassword}}",
        "code": "{{customerMfaCode}}"
      }
runtime:
  scripts:
    - type: before-request
      code: |-
        if (!/^[A-Za-z0-9_-]{43}$/.test(bru.interpolate("{{recoveryToken}}"))) {
          throw new Error("Set RECOVERY_TOKEN in api-client/.env from the worker mail log.");
        }
    - type: after-response
      code: |-
        if (res.status === 200) {
          bru.setVar("accessToken", "");
          bru.setVar("sessionId", "");
          bru.setVar("customerPassword", bru.interpolate("{{customerNewPassword}}"));
          bru.setVar("profileVersion", "");
        }
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.status
      operator: eq
      value: acknowledged
docs: |-
  Revokes all customer sessions. The new password is used in memory for the
  next login; update CUSTOMER_PASSWORD in .env before restarting Bruno.
