info:
  name: customer-change-password
  type: http
  seq: 7
http:
  method: POST
  url: "{{baseUrl}}/v1/me/password"
  auth: inherit
  body:
    type: json
    data: |-
      { "password": "{{customerNewPassword}}" }
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          bru.setVar("customerPassword", bru.interpolate("{{customerNewPassword}}"));
          bru.setVar("accessToken", "");
          bru.setVar("sessionId", "");
          bru.setVar("profileVersion", "");
        }
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.status
      operator: eq
      value: acknowledged
docs: |-
  Requires recent authentication and revokes all sessions. Next login uses the
  new password in memory; update CUSTOMER_PASSWORD in .env before restarting Bruno.
