info:
  name: preview-departure
  type: http
  seq: 9
  tags: [smoke]
http:
  method: GET
  url: "{{baseUrl}}/v1/spaces/{{spaceId}}/departure"
  auth: inherit
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.membership_id
      operator: isString
    - expression: res.body.requires_ownership_transfer
      operator: isBoolean
    - expression: res.body.requires_billing_resolution
      operator: isBoolean
docs: |-
  Read-only preview; does not remove the caller. Ownership and billing
  responsibilities must be resolved separately before departure.
