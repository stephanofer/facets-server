info:
  name: claim-billing-responsibility
  type: http
  seq: 8
http:
  method: POST
  url: "{{baseUrl}}/v1/spaces/{{spaceId}}/billing/claim"
  auth: inherit
  headers:
    - name: Idempotency-Key
      value: "{{$randomUUID}}"
  body:
    type: json
    data: |-
      { "confirm": true }
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.id
      operator: isString
docs: |-
  Requires recent authentication and manage capability. Claims billing for the
  caller's membership, independently of ownership. Never inherits payment data.
